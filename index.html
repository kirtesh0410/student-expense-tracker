<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="google-site-verification" content="ytlrslZztYHPcGNV3T4fRF1Ntum68hpQmO7uUUU6R6w" />
    <title>Student Expense Tracker</title>
    <style>
         :root {
            --bg: #F8FAFC;
            --card: #fff;
            --pri: #4F46E5;
            --txt: #111827;
            --mut: #6B7280;
            --bd: #E5E7EB;
            --ok: #15803D;
            --warn: #B45309;
            --bad: #DC2626;
            --sh: 0 1px 3px rgba(0, 0, 0, .06);
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }
        
        @media(prefers-color-scheme:dark) {
             :root:not([data-theme=light]) {
                --bg: #0B1120;
                --card: #121B30;
                --pri: #818CF8;
                --txt: #E5E7EB;
                --mut: #9CA3AF;
                --bd: #25314D;
                --ok: #4ADE80;
                --warn: #FBBF24;
                --bad: #F87171;
                --sh: none
            }
        }
        
         :root[data-theme=dark] {
            --bg: #0B1120;
            --card: #121B30;
            --pri: #818CF8;
            --txt: #E5E7EB;
            --mut: #9CA3AF;
            --bd: #25314D;
            --ok: #4ADE80;
            --warn: #FBBF24;
            --bad: #F87171;
            --sh: none
        }
        
        html,
        body {
            height: auto;
            margin: 0
        }
        
        * {
            box-sizing: border-box
        }
        
        body {
            background: var(--bg);
            color: var(--txt);
            font: 15px/1.5 Inter, system-ui, -apple-system, Segoe UI, sans-serif
        }
        
        button,
        input,
        select {
            font: inherit;
            color: inherit
        }
        
         :focus-visible {
            outline: 2px solid var(--pri);
            outline-offset: 2px
        }
        
        #app {
            display: flex;
            min-height: 100vh
        }
        
        nav.sb {
            width: 220px;
            padding: 20px 14px;
            border-right: 1px solid var(--bd);
            background: var(--card);
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 4px
        }
        
        nav.sb h1 {
            font-size: 17px;
            margin: 0 8px 16px
        }
        
        .nv {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border: 0;
            background: none;
            border-radius: 10px;
            cursor: pointer;
            color: var(--mut);
            text-align: left;
            width: 100%
        }
        
        .nv:hover {
            background: var(--bg)
        }
        
        .nv[aria-current=page] {
            background: var(--pri);
            color: #fff
        }
        
        main {
            flex: 1;
            padding: 24px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            padding-bottom: 100px;
            animation: in .2s
        }
        
        @keyframes in {
            from {
                opacity: 0;
                transform: translateY(6px)
            }
        }
        
        .hd {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px
        }
        
        .hd h2 {
            margin: 0;
            font-size: 24px
        }
        
        .mut {
            color: var(--mut)
        }
        
        .sm {
            font-size: 13px
        }
        
        .grid {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            margin-bottom: 14px
        }
        
        .g2 {
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr))
        }
        
        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--sh);
            transition: transform .15s
        }
        
        .card:hover {
            transform: translateY(-1px)
        }
        
        .card h3 {
            margin: 0 0 10px;
            font-size: 16px
        }
        
        .big {
            font-size: 24px;
            font-weight: 700
        }
        
        .btn {
            background: var(--pri);
            color: #fff;
            border: 0;
            border-radius: 10px;
            padding: 9px 14px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity .15s
        }
        
        .btn:hover {
            opacity: .88
        }
        
        .btn.g {
            background: transparent;
            color: var(--txt);
            border: 1px solid var(--bd)
        }
        
        .btn.d {
            background: var(--bad);
            color: #fff
        }
        
        .btn.s {
            padding: 5px 9px;
            font-size: 13px
        }
        
        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center
        }
        
        .row.r {
            justify-content: flex-end
        }
        
        .pb {
            height: 10px;
            background: var(--bd);
            border-radius: 9px;
            overflow: hidden
        }
        
        .pb i {
            display: block;
            height: 100%;
            border-radius: 9px;
            transition: width .5s;
            background: var(--pri)
        }
        
        .pb.warn i {
            background: var(--warn)
        }
        
        .pb.bad i {
            background: var(--bad)
        }
        
        .tag {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid currentColor
        }
        
        .ok {
            color: var(--ok)
        }
        
        .warn {
            color: var(--warn)
        }
        
        .bad {
            color: var(--bad)
        }
        
        .tx {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--bd)
        }
        
        .tx:last-child {
            border: 0
        }
        
        .ic {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: var(--bg);
            display: grid;
            place-items: center;
            font-size: 18px;
            flex: none
        }
        
        .tx .m {
            flex: 1;
            min-width: 0
        }
        
        .tx .m b {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap
        }
        
        input,
        select {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 8px 10px;
            min-width: 0
        }
        
        label {
            display: block;
            font-size: 13px;
            color: var(--mut);
            margin-bottom: 10px
        }
        
        label input,
        label select {
            display: block;
            width: 100%;
            margin-top: 4px;
            color: var(--txt)
        }
        
        .ov {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .45);
            display: grid;
            place-items: center;
            padding: 14px;
            z-index: 50
        }
        
        .md {
            background: var(--card);
            border-radius: 18px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            max-height: 92vh;
            overflow: auto;
            animation: in .15s
        }
        
        .md h3 {
            margin: 0 0 14px
        }
        
        .err {
            color: var(--bad);
            font-size: 13px;
            min-height: 18px;
            margin: 0
        }
        
        .fab {
            position: fixed;
            right: 18px;
            bottom: 76px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            font-size: 26px;
            padding: 0;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .25);
            z-index: 20;
            display: none
        }
        
        #toasts {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99;
            display: grid;
            gap: 6px
        }
        
        .toast {
            background: var(--txt);
            color: var(--bg);
            padding: 9px 16px;
            border-radius: 10px;
            font-size: 14px;
            animation: in .2s
        }
        
        .empty {
            text-align: center;
            padding: 30px 10px;
            color: var(--mut)
        }
        
        .empty b {
            display: block;
            color: var(--txt);
            font-size: 17px;
            margin-bottom: 4px
        }
        
        .leg {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 2px 0
        }
        
        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 3px;
            margin-right: 6px
        }
        
        .bars {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 120px
        }
        
        .bars div {
            flex: 1;
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 100%
        }
        
        .bars i {
            flex: 1;
            background: var(--pri);
            border-radius: 4px 4px 0 0;
            min-height: 2px
        }
        
        .bars i.b {
            background: #8B5CF6;
            opacity: .6
        }
        
        .axis {
            display: flex;
            gap: 3px;
            font-size: 11px;
            color: var(--mut)
        }
        
        .axis span {
            flex: 1;
            text-align: center
        }
        
        ul.in {
            margin: 0;
            padding-left: 18px
        }
        
        ul.in li {
            margin: 5px 0
        }
        
        .tp {
            position: fixed;
            z-index: 80;
            width: 270px;
            max-width: calc(100vw - 20px);
            background: var(--card);
            border: 2px solid var(--pri);
            border-radius: 14px;
            padding: 12px 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
            animation: in .15s
        }
        
        .tp p {
            margin: 6px 0 10px
        }
        
        .hl {
            outline: 3px solid var(--pri);
            outline-offset: 3px;
            border-radius: 10px;
            position: relative;
            z-index: 70
        }
        
        .wl {
            max-width: 520px;
            margin: 5vh auto;
            text-align: center
        }
        
        .wl .btn {
            width: 100%;
            font-size: 17px;
            padding: 14px
        }
        
        .wl p {
            margin: 8px 0 22px
        }
        
        @media(max-width:800px) {
            nav.sb {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                top: auto;
                width: auto;
                height: auto;
                flex-direction: row;
                padding: 6px;
                z-index: 30;
                border-top: 1px solid var(--bd);
                border-right: 0;
                justify-content: space-around;
                padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px))
            }
            nav.sb h1 {
                display: none
            }
            .nv {
                flex-direction: column;
                gap: 0;
                font-size: 11px;
                padding: 6px 2px;
                text-align: center;
                align-items: center
            }
            .nv span:first-child {
                font-size: 18px
            }
            .fab {
                display: block
            }
            main {
                padding: 16px 14px 150px
            }
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <div id="toasts" aria-live="polite"></div>
    <script>
        const CATS = [
            ['Food', '🍔'],
            ['Travel', '🚌'],
            ['Education', '📚'],
            ['Shopping', '🛍️'],
            ['Entertainment', '🎬'],
            ['Bills', '💡'],
            ['Hostel/Rent', '🏠'],
            ['Health', '💊'],
            ['Recharge', '📱'],
            ['Subscriptions', '🔁'],
            ['Other', '✨']
        ];
        const PAYS = ['Cash', 'UPI', 'Debit Card', 'Credit Card', 'Bank Transfer', 'Other'],
            INCS = ['Pocket money', 'Salary', 'Scholarship', 'Freelance income', 'Gift', 'Other'];
        const COL = ['#6366F1', '#8B5CF6', '#22C55E', '#F59E0B', '#EF4444', '#06B6D4', '#EC4899', '#84CC16', '#F97316', '#14B8A6', '#64748B', '#A855F7', '#0EA5E9'];
        const KEY = 'set_v1';
        // ---------- storage ----------
        const DEF = {
            started: false,
            demo: false,
            tx: [],
            budget: 0,
            catB: {},
            goals: [],
            custom: [],
            theme: 'system',
            cur: 'INR'
        };

        function load() {
            try {
                const s = JSON.parse(localStorage.getItem(KEY));
                if (s && Array.isArray(s.tx) && Array.isArray(s.goals)) return {...DEF,
                    ...s
                }
            } catch (e) {}
            return {...DEF
            }
        }

        function save() {
            try {
                localStorage.setItem(KEY, JSON.stringify(S))
            } catch (e) {
                toast('Could not save data')
            }
        }
        let S = load(),
            V = 'dash',
            YM = ym(new Date()),
            F = {
                q: '',
                cat: 'All',
                pay: 'All',
                sort: 'new',
                all: false,
                n: 15
            };
        // ---------- helpers ----------
        const esc = s => String(s ? ? '').replace(/[&<>"']/g, c => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        }[c]));

        function ym(d) {
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')
        }
        const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        const shift = (m, k) => {
            const [y, mo] = m.split('-').map(Number);
            return ym(new Date(y, mo - 1 + k, 1))
        };
        const mLabel = m => {
            const [y, mo] = m.split('-').map(Number);
            return new Date(y, mo - 1, 1).toLocaleString('en', {
                month: 'long',
                year: 'numeric'
            })
        };
        const M = n => new Intl.NumberFormat(S.cur == 'INR' ? 'en-IN' : 'en-US', {
            style: 'currency',
            currency: S.cur,
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
        }).format(n || 0);
        const fd = s => new Date(s + 'T00:00').toLocaleDateString('en', {
            day: 'numeric',
            month: 'short'
        });
        const cats = () => [...CATS.map(c => c[0]), ...S.custom];
        const icon = c => (CATS.find(x => x[0] == c) || [0, '🏷️'])[1];
        const col = c => COL[Math.max(0, cats().indexOf(c)) % COL.length];
        const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

        function toast(t) {
            const e = document.createElement('div');
            e.className = 'toast';
            e.textContent = t;
            document.getElementById('toasts').appendChild(e);
            setTimeout(() => e.remove(), 2500)
        }
        // ---------- calculations ----------
        function stats(m) {
            const t = S.tx.filter(x => x.date.startsWith(m));
            const ex = t.filter(x => x.type == 'e'),
                inc = t.filter(x => x.type == 'i');
            const by = {};
            ex.forEach(x => by[x.cat] = (by[x.cat] || 0) + x.amount);
            const sum = a => a.reduce((s, x) => s + x.amount, 0);
            const [y, mo] = m.split('-').map(Number), dim = new Date(y, mo, 0).getDate();
            const now = new Date(),
                cur = ym(now) == m,
                el = cur ? now.getDate() : (m < ym(now) ? dim : 0),
                left = cur ? dim - now.getDate() + 1 : 0;
            return {
                ex,
                inc,
                by,
                exp: sum(ex),
                income: sum(inc),
                dim,
                el,
                left,
                cur
            }
        }

        function pct(a, b) {
            return b > 0 ? a / b * 100 : 0
        }

        function status(sp, b) {
            if (!b) return {
                c: 'warn',
                t: 'No budget set',
                s: 'Set a monthly budget to see how you are doing.'
            };
            const p = pct(sp, b);
            if (p > 100) return {
                c: 'bad',
                t: 'Over budget',
                s: M(sp - b) + ' above budget. It happens — adjust and keep going.'
            };
            if (p >= 75) return {
                c: 'warn',
                t: 'Caution',
                s: 'You are close to your monthly limit (' + Math.round(p) + '% used).'
            };
            return {
                c: 'ok',
                t: 'Good',
                s: M(b - sp) + ' remaining'
            }
        }

        function bar(p, cl) {
            return `<div class="pb ${cl||''}" role="progressbar" aria-valuenow="${Math.round(p)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.min(100,p)}%"></i></div>`
        }

        function insights(m) {
            const s = stats(m),
                p = stats(shift(m, -1)),
                o = [];
            if (!s.ex.length) return ['Add a few expenses to unlock insights.'];
            const top = Object.entries(s.by).sort((a, b) => b[1] - a[1])[0];
            o.push(`Your highest spending category is ${top[0]} (${M(top[1])}).`);
            const big = [...s.ex].sort((a, b) => b.amount - a.amount)[0];
            o.push(`Most expensive transaction: ${esc(big.title)} at ${M(big.amount)}.`);
            const avg = s.exp / Math.max(1, s.el);
            o.push(`Average daily spending is ${M(avg)}; weekly about ${M(avg*7)}.`);
            o.push(`${s.ex.length} expense transactions this month.`);
            if (p.exp) o.push(`You spent ${Math.abs(Math.round((s.exp-p.exp)/p.exp*100))}% ${s.exp>=p.exp?'more':'less'} than last month.`);
            if (S.budget) {
                const r = S.budget - s.exp;
                o.push(r >= 0 ? `You have ${M(r)} remaining this month.` : `You are ${M(-r)} over budget.`);
                if (s.cur && s.left && r > 0) o.push(`To stay within budget, try to spend less than ${M(r/s.left)} per day.`);
            }
            if (s.cur) o.push(`Estimated end-of-month spending: ${M(avg*s.dim)}.`);
            return o
        }

        function alerts() {
            const s = stats(ym(new Date())),
                a = [];
            if (S.budget) {
                const p = pct(s.exp, S.budget);
                if (p > 100) a.push('Your monthly budget has been exceeded.');
                else if (p >= 75) a.push(`Your budget is ${Math.round(p)}% used.`)
            }
            Object.entries(S.catB).forEach(([c, b]) => {
                const sp = s.by[c] || 0;
                if (b && sp > b) a.push(`${c} budget exceeded by ${M(sp-b)}.`);
                else if (b && pct(sp, b) >= 75) a.push(`${c} budget is ${Math.round(pct(sp,b))}% used.`)
            });
            return a
        }
        // ---------- charts ----------
        function donut(by) {
            const t = Object.values(by).reduce((a, b) => a + b, 0);
            if (!t) return '<div class="empty">No spending this month yet.</div>';
            let cum = 0;
            const seg = Object.entries(by).sort((a, b) => b[1] - a[1]);
            return `<div class="row" style="justify-content:center"><svg viewBox="0 0 36 36" width="150" height="150" role="img" aria-label="Spending by category">${seg.map(([c,v])=>{const p=v/t*100,r=`<circle cx="18" cy="18" r="15.9155" fill="none" stroke="${col(c)}" stroke-width="5" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-cum}"/>`;cum+=p;return r}).join('')}</svg>
 <div style="flex:1;min-width:150px">${seg.map(([c,v])=>`<div class="leg"><span><i class="dot" style="background:${col(c)}"></i>${esc(c)}</span><b>${M(v)} · ${Math.round(v/t*100)}%</b></div>`).join('')}</div></div>`}
function months6(){const r=[];for(let i=5;i>=0;i--){const m=shift(YM,-i),s=stats(m);r.push({m,e:s.exp,i:s.income})}return r}
function bars(data,lab,two){const mx=Math.max(1,...data.map(d=>Math.max(d.e,d.i||0)));
 return`<div class="bars">${data.map(d=>`<div title="${lab(d)}"><i style="height:${d.e/mx*100}%"></i>${two?`<i class="b" style="height:${d.i/mx*100}%"></i>`:''}</div>`).join('')}</div>`}
// ---------- modals ----------
function modal(title,fields,ok,submit){const d=document.createElement('div');d.className='ov';
 d.innerHTML=`<form class="md" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${fields.map(f=>`<label>${f.l}${f.o?`<select name="${f.n}">${f.o.map(o=>`<option ${o==f.v?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input name="${f.n}" type="${f.t||'text'}" value="${esc(f.v??'')}" ${f.t=='number'?'step="any" inputmode="decimal"':''} ${f.ph?`placeholder="${f.ph}"`:''}>`}</label>`).join('')}<p class="err" role="alert"></p><div class="row r"><button type="button" class="btn g" data-x>Cancel</button><button class="btn ${ok[1]||''}">${ok[0]||ok}</button></div></form>`;
 document.body.appendChild(d);const fm=d.firstChild;const f1=fm.querySelector('input,select');if(f1)f1.focus();
 d.onclick=e=>{if(e.target==d||e.target.dataset.x!=null)d.remove()};
 fm.onsubmit=e=>{e.preventDefault();const er=submit(Object.fromEntries(new FormData(fm)));if(er)fm.querySelector('.err').textContent=er;else d.remove()}}
document.addEventListener('keydown',e=>{if(e.key=='Escape'){const o=[...document.querySelectorAll('.ov')].pop();o&&o.remove()}});
function amt(v){const n=parseFloat(v);return isFinite(n)&&n>0?Math.round(n*100)/100:null}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s+'T00:00'))}
function txModal(type,ed){const e=type=='e';const t=ed||{};
 const fl=[{n:'amount',l:'Amount ('+S.cur+')',t:'number',v:t.amount,ph:'0'},{n:'title',l:e?'Expense name':'Income source note',v:t.title,ph:e?'e.g. Canteen lunch':'e.g. October pocket money'},
  {n:'cat',l:e?'Category':'Type',o:e?cats():INCS,v:t.cat||(e?'Food':'Pocket money')}];
 if(e)fl.push({n:'newcat',l:'Or create a new category (optional)',v:''});
 fl.push({n:'date',l:'Date',t:'date',v:t.date||iso(new Date())});
